<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Document</title>
    <script src="./front.js" defer type="module"></script>
    <style>
        body{
            box-sizing: border-box;
            margin: 0;
        }
        main {
            height: 100vh;
            background-image: url("./assets/images/bg.png");
            background-repeat: no-repeat;
            background-size: cover;
            display: flex;
            flex-direction: column;
            align-items: center;
            row-gap: 15%;
        }

        div.scoreBlock {
            height: 80px;
            width: 80%;
            /*display: flex;
            align-items: center;
            justify-content: center;*/
            padding: 15px;
            column-gap: 40px;
            font-size: 20px;
            color: #fff;
            border: 1px solid #4C5E50;
            background-color: #393D374D;
            border-radius: 50px;
            margin-top: 10%;
        }

        .scorePlayer, .scoreBlock {
            display: flex;
            align-items: center;
            justify-content: center;
            column-gap: 10px;
        }

        .scorePlayer img{
            width: 40px;
            height: 40px;
        }

        td {
            width: 75px;
            height: 75px;
            margin: 3px 4px;
            border: 2px solid #999B95;
            background-color: #6E75664D;
            border-radius: 8px;
            display: inline-flex;
            justify-content: center;
            align-items: center;
            vertical-align: top
        }

        img {
            width: 55px;
            height: 55px;
        }
    </style>
</head>
<body>
<main>
    <div class="scoreBlock">
        <div class="scorePlayer">
            <img src="./assets/images/player1.svg" alt="player1">
            <span>Player 1:
                <span id="score1">
                0
                </span>
            </span>
        </div>
        <div>
            <img src="./assets/images/player2.svg" alt="player2">
            <span>Player 2:
                <span id="score2">
                0
                </span>
            </span>
        </div>

    </div>
    <table id="grid"></table>
</main>
</body>
</html>
